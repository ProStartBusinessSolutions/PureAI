name: Docker image

# Builds the PureAI server image for ARM64 (the DGX Spark) and publishes it to the private package
# ghcr.io/prostartbusinesssolutions/pureai. Runs when a version tag is pushed (e.g. v1.0.0), which publishes the
# version and "latest", or by hand from the Actions tab. A hand-run on a branch publishes "main", never "latest", so
# "latest" only ever moves to a tagged release. See DEPLOYMENT.md.
#
# Each platform builds on a native runner (no emulation — compiling llama.cpp for CUDA under QEMU would take hours),
# pushes by digest, and a final job stitches them into one tag.

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

# A newer push to the same branch replaces a build that is still running.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/prostartbusinesssolutions/pureai

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Only SmartReader is needed to build; the voice-engine submodules are ~1 GB and stay out of the image.
      - run: git submodule update --init --depth 1 Submodules/SmartReader

      # A release tag's number wins over manifest.json, and is written into it so the server inside reports it too.
      - id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
            tmp="$(mktemp)"; jq --arg v "$V" '.version = $v' manifest.json > "$tmp" && mv "$tmp" manifest.json
          else
            V="$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "pair=${{ matrix.platform }}" | sed 's#/#-#' >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            ARI_VERSION=${{ steps.meta.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.meta.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.meta.outputs.pair }}

      - run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.meta.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tags
        working-directory: /tmp/digests
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"
          else V="$(python3 -c "import json;print(json.load(open('${GITHUB_WORKSPACE}/manifest.json'))['version'])")"; fi
          # A release tag publishes its version number (so it can be pinned) and "latest" (what the Spark runs).
          # A hand-run on a branch publishes "main" only, so "latest" never points at an untagged build.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAGS="-t ${IMAGE}:${V} -t ${IMAGE}:latest"; SHOW="${IMAGE}:${V}"
          else
            TAGS="-t ${IMAGE}:main"; SHOW="${IMAGE}:main"
          fi
          docker buildx imagetools create ${TAGS} $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${SHOW}"
